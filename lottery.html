<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 球体抽奖系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  /* ===== 全局重置 ===== */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #080c0a;
    --ink-light: #0e1511;
    --gold: #c9a96e;
    --gold-light: #e0c78a;
    --gold-dark: #a07d3e;
    --jade: #5a9e8e;
    --jade-subtle: #3a6e60;
    --cream: #f0e6d3;
    --text-primary: #e8e0d5;
    --text-secondary: #a09888;
    --text-muted: #605848;
    --border-subtle: rgba(201, 169, 110, 0.15);
    --border-active: rgba(201, 169, 110, 0.45);
    --glass-bg: rgba(14, 21, 17, 0.75);
    --glass-border: rgba(201, 169, 110, 0.12);
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 24px;
    --radius-xl: 60px;
    --font-display: 'Noto Serif SC', 'STSong', 'SimSun', serif;
    --font-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }

  body {
    font-family: var(--font-body);
    background: var(--ink);
    width: 100vw; height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    color: var(--text-primary);
  }

  /* ===== 背景层：晶格金线 ===== */
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 55% 35%, rgba(201,169,110,0.06) 0%, transparent 55%),
      radial-gradient(ellipse at 30% 70%, rgba(90,158,142,0.05) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 60%, rgba(201,169,110,0.03) 0%, transparent 45%);
  }
  .bg-grid::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(201,169,110,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,169,110,0.04) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: radial-gradient(ellipse 70% 70% at 50% 45%, black 20%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 45%, black 20%, transparent 70%);
  }
  /* 对角线光芒 */
  .bg-grid::after {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(135deg, rgba(201,169,110,0.08) 0%, transparent 40%),
      linear-gradient(225deg, rgba(90,158,142,0.05) 0%, transparent 35%);
    animation: diagonalShimmer 12s ease-in-out infinite;
  }
  @keyframes diagonalShimmer {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* 浮动光点 */
  .floating-light {
    position: fixed; z-index: 0; pointer-events: none;
    border-radius: 50%;
    filter: blur(80px);
    animation: floatLight 16s ease-in-out infinite;
  }
  .floating-light-1 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(201,169,110,0.12) 0%, transparent 70%);
    top: -80px; right: -60px;
    animation-delay: 0s;
  }
  .floating-light-2 {
    width: 240px; height: 240px;
    background: radial-gradient(circle, rgba(90,158,142,0.1) 0%, transparent 70%);
    bottom: -60px; left: -40px;
    animation-delay: -8s;
  }
  @keyframes floatLight {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(40px, -30px) scale(1.2); }
    50% { transform: translate(-20px, 20px) scale(0.85); }
    75% { transform: translate(-35px, -15px) scale(1.1); }
  }

  /* ===== 画布容器 ===== */
  #canvas-container {
    position: fixed; inset: 0; z-index: 1;
  }
  #canvas-container canvas { display: block; }

  /* ===== UI 覆盖层 ===== */
  #ui-layer {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    pointer-events: none;
    padding: 36px 28px;
  }
  #ui-layer > * { pointer-events: auto; }

  /* ===== 标题 ===== */
  .title-wrapper {
    text-align: center;
  }
  .title {
    font-family: var(--font-display);
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 900;
    letter-spacing: 0.08em;
    background: linear-gradient(
      180deg,
      #e0c78a 0%,
      #c9a96e 25%,
      #f0d898 50%,
      #a07d3e 75%,
      #c9a96e 100%
    );
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 8px rgba(201,169,110,0.3));
    line-height: 1.3;
  }
  .title-ornament {
    display: block;
    width: 48px; height: 1px;
    margin: 10px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.6;
  }

  /* ===== 中奖展示 ===== */
  #winner-display {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 20; pointer-events: none;
    transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  #winner-display.show {
    transform: translate(-50%, -50%) scale(1);
  }
  #winner-display.show .winner-card {
    animation: cardReveal 0.6s ease-out;
  }
  @keyframes cardReveal {
    0% { opacity: 0; transform: scale(0.8); }
    60% { opacity: 1; transform: scale(1.02); }
    100% { transform: scale(1); }
  }
  .winner-card {
    background: rgba(8, 12, 10, 0.9);
    backdrop-filter: blur(32px);
    -webkit-backdrop-filter: blur(32px);
    border: 1.5px solid rgba(201, 169, 110, 0.5);
    border-radius: var(--radius-lg);
    padding: 52px 72px;
    text-align: center;
    position: relative;
    box-shadow:
      0 0 100px rgba(201, 169, 110, 0.3),
      0 0 200px rgba(201, 169, 110, 0.1),
      0 0 40px rgba(201, 169, 110, 0.15) inset,
      0 1px 0 rgba(255, 255, 255, 0.04) inset;
  }
  /* 金色外发光环 */
  .winner-card::before {
    content: '';
    position: absolute; inset: -4px; border-radius: 28px;
    padding: 1.5px;
    background: linear-gradient(135deg,
      rgba(201,169,110,0.6),
      transparent 30%,
      transparent 70%,
      rgba(201,169,110,0.4)
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .winner-label {
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--text-secondary);
    letter-spacing: 0.2em;
    margin-bottom: 16px;
    text-transform: uppercase;
  }
  .winner-name {
    font-family: var(--font-display);
    font-size: clamp(40px, 6vw, 72px);
    font-weight: 900;
    background: linear-gradient(180deg, #f0d898 0%, #c9a96e 40%, #8a6530 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 28px rgba(201,169,110,0.5));
    line-height: 1.1;
  }
  .winner-sparkle {
    position: absolute;
    width: 4px; height: 4px;
    background: var(--gold-light);
    border-radius: 50%;
    animation: sparkle 1.5s ease-in-out infinite;
    box-shadow: 0 0 8px var(--gold-light), 0 0 16px var(--gold);
  }
  .winner-sparkle:nth-child(1) { top: 12px; left: 20%; animation-delay: 0s; }
  .winner-sparkle:nth-child(2) { top: 20px; right: 25%; animation-delay: 0.4s; }
  .winner-sparkle:nth-child(3) { bottom: 18px; left: 30%; animation-delay: 0.8s; }
  .winner-sparkle:nth-child(4) { bottom: 14px; right: 22%; animation-delay: 1.2s; }
  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  /* ===== 控制区 ===== */
  #controls {
    display: flex; gap: 14px; flex-wrap: wrap;
    justify-content: center; align-items: center;
    margin-bottom: 12px;
  }
  .btn {
    padding: 13px 38px;
    border: none; border-radius: var(--radius-xl);
    font-size: 15px; font-weight: 600;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1.2);
    position: relative; overflow: hidden;
    font-family: var(--font-body);
    outline: none;
  }
  .btn:active { transform: scale(0.94); }
  .btn:disabled {
    opacity: 0.3; cursor: not-allowed; pointer-events: none;
    filter: grayscale(30%);
  }

  /* 开始按钮 — 金色 */
  .btn-start {
    background: linear-gradient(135deg, #c9a96e 0%, #a07d3e 50%, #8a6530 100%);
    color: #0a0f0c;
    font-weight: 700;
    box-shadow:
      0 4px 28px rgba(201,169,110,0.35),
      0 1px 3px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.2);
    border: 1px solid rgba(201,169,110,0.5);
  }
  .btn-start::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, transparent 50%);
    pointer-events: none;
  }
  .btn-start:hover:not(:disabled) {
    box-shadow:
      0 6px 36px rgba(201,169,110,0.5),
      0 2px 4px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.25);
    transform: translateY(-2px);
  }

  /* 停止按钮 — 朱砂红 */
  .btn-stop {
    background: linear-gradient(135deg, #c0392b 0%, #96281b 50%, #7b1f17 100%);
    color: #f0e6d3;
    box-shadow:
      0 4px 24px rgba(192,57,43,0.35),
      0 1px 3px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.12);
    border: 1px solid rgba(192,57,43,0.4);
  }
  .btn-stop::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 50%);
    pointer-events: none;
  }
  .btn-stop:hover:not(:disabled) {
    box-shadow:
      0 6px 32px rgba(192,57,43,0.5),
      0 2px 4px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.15);
    transform: translateY(-2px);
  }

  /* 重置按钮 — 轮廓 */
  .btn-reset {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid rgba(201,169,110,0.25);
    backdrop-filter: blur(8px);
  }
  .btn-reset:hover:not(:disabled) {
    background: rgba(201,169,110,0.08);
    border-color: rgba(201,169,110,0.5);
    color: var(--text-primary);
    transform: translateY(-2px);
  }

  /* ===== 名单面板 ===== */
  #name-panel {
    background: var(--glass-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-md);
    padding: 20px 24px;
    width: min(540px, 92vw);
    display: flex; flex-direction: column; gap: 14px;
    position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  /* 顶部金色细线 */
  #name-panel::before {
    content: '';
    position: absolute; top: 0; left: 20px; right: 20px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,169,110,0.3), transparent);
  }
  #name-panel label {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 500;
  }
  #name-input {
    width: 100%; min-height: 68px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(201,169,110,0.18);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 13px; line-height: 1.8;
    padding: 12px 16px; resize: vertical;
    font-family: var(--font-body);
    transition: all 0.3s ease;
  }
  #name-input:focus {
    outline: none;
    border-color: var(--border-active);
    box-shadow: 0 0 0 3px rgba(201,169,110,0.06),
                inset 0 0 20px rgba(201,169,110,0.03);
  }
  #name-input::placeholder {
    color: var(--text-muted);
  }
  #name-input:disabled {
    opacity: 0.35;
  }
  .panel-row {
    display: flex; gap: 12px; align-items: center;
  }
  .btn-apply {
    padding: 9px 26px;
    border-radius: var(--radius-xl);
    border: 1px solid rgba(201,169,110,0.35);
    background: rgba(201,169,110,0.08);
    color: var(--gold);
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2);
    font-family: var(--font-body);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .btn-apply:hover:not(:disabled) {
    background: rgba(201,169,110,0.16);
    border-color: var(--border-active);
    box-shadow: 0 2px 16px rgba(201,169,110,0.12);
  }
  .btn-apply:active:not(:disabled) { transform: scale(0.95); }
  .btn-apply:disabled { opacity: 0.3; cursor: not-allowed; }
  .name-count {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    font-weight: 500;
    letter-spacing: 0.03em;
  }

  /* ===== 键盘提示 ===== */
  .hint {
    font-size: 11px;
    color: rgba(96,88,72,0.6);
    letter-spacing: 0.06em;
    text-align: center;
    margin-top: 6px;
    font-weight: 300;
  }
  .hint-key {
    display: inline-block;
    background: rgba(201,169,110,0.1);
    border: 1px solid rgba(201,169,110,0.2);
    border-radius: 4px;
    padding: 1px 7px;
    margin: 0 2px;
    font-size: 10px;
    letter-spacing: 0;
    color: var(--text-secondary);
  }

  /* ===== 响应式 ===== */
  @media (max-width: 640px) {
    #ui-layer { padding: 20px 12px; }
    .btn { padding: 11px 26px; font-size: 14px; }
    .winner-card { padding: 36px 40px; }
    .title { font-size: 24px; }
  }
</style>
</head>
<body>

<!-- 背景 -->
<div class="bg-grid"></div>
<div class="floating-light floating-light-1"></div>
<div class="floating-light floating-light-2"></div>

<!-- Three.js 画布 -->
<div id="canvas-container"></div>

<!-- UI 层 -->
<div id="ui-layer">
  <div class="title-wrapper">
    <h1 class="title">3D 球体抽奖系统</h1>
    <span class="title-ornament"></span>
  </div>

  <div></div> <!-- 占位 -->

  <div>
    <!-- 控制按钮 -->
    <div id="controls">
      <button class="btn btn-start" id="btn-start">开始抽奖</button>
      <button class="btn btn-stop" id="btn-stop" disabled>停止</button>
      <button class="btn btn-reset" id="btn-reset">重置</button>
    </div>
    <p class="hint">
      <span class="hint-key">Space</span> 开始/停止 &nbsp;
      <span class="hint-key">R</span> 重置 &nbsp; 鼠标拖拽旋转视角
    </p>

    <!-- 名单输入 -->
    <div id="name-panel">
      <label for="name-input">抽奖名单（逗号分隔）</label>
      <textarea id="name-input" placeholder="输入名字，用逗号分隔…">刘人瑞,罗宇,龙金林,余秋墨,岳帅,张采云,程于颜,蔡丫丫,成晓源,何昊东,郎梓希,张子萱,廖梅,王家扬,田琴婵,吴嘉豪,付冰冰,王燕,曹素,韦薇,李旭,王玲,朱沈珊,曹浩楠,罗君晨,吴进煜,杨林标</textarea>
      <div class="panel-row">
        <button class="btn-apply" id="btn-apply">应用名单</button>
        <span class="name-count" id="name-count">共 27 人</span>
      </div>
    </div>
  </div>
</div>

<!-- 中奖弹窗 -->
<div id="winner-display">
  <div class="winner-card">
    <div class="winner-sparkle"></div>
    <div class="winner-sparkle"></div>
    <div class="winner-sparkle"></div>
    <div class="winner-sparkle"></div>
    <div class="winner-label">恭喜中奖</div>
    <div class="winner-name" id="winner-name-text"></div>
  </div>
</div>

<!-- Three.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.min.js"></script>

<script>
// ============================================================
// 3D 球体抽奖系统 — Three.js 实现
// ============================================================

// ----- 配置 -----
const CONFIG = {
  sphereRadius: 5,
  particleCount: 1800,
  ambientParticleCount: 200,
  maxSpeed: 0.12,
  idleSpeed: 0.004,
  decelFriction: 0.985,
  stopThreshold: 0.0005,
  spriteScale: 1.3,
  cameraDistance: 16
};

// ----- DOM 引用 -----
const container = document.getElementById('canvas-container');
const btnStart = document.getElementById('btn-start');
const btnStop = document.getElementById('btn-stop');
const btnReset = document.getElementById('btn-reset');
const btnApply = document.getElementById('btn-apply');
const nameInput = document.getElementById('name-input');
const nameCount = document.getElementById('name-count');
const winnerDisplay = document.getElementById('winner-display');
const winnerNameText = document.getElementById('winner-name-text');

// ----- 状态 -----
let names = [];
let state = 'idle';
let currentSpeed = 0;
let targetSpeed = CONFIG.idleSpeed;
let winnerName = null;
let winnerSprite = null;
let nameSprites = [];
let celebration = null;

// ----- Three.js 初始化 -----
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  50, container.clientWidth / container.clientHeight, 0.5, 100
);
camera.position.set(0, 1.5, CONFIG.cameraDistance);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// ----- 灯光：暖金+玉石调 -----
scene.add(new THREE.AmbientLight(0x3a3020, 2.5));
const pointLight1 = new THREE.PointLight(0xc9a96e, 40, 30);
pointLight1.position.set(10, 8, 10);
scene.add(pointLight1);
const pointLight2 = new THREE.PointLight(0x5a9e8e, 25, 25);
pointLight2.position.set(-8, -3, -6);
scene.add(pointLight2);

// ----- Fibonacci 球面分布 -----
function fibonacciSphere(n, radius) {
  const pts = [];
  const phi = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < n; i++) {
    const y = 1 - (i / (n - 1)) * 2;
    const rAtY = Math.sqrt(1 - y * y);
    const theta = phi * i;
    pts.push({
      x: Math.cos(theta) * rAtY * radius,
      y: y * radius,
      z: Math.sin(theta) * rAtY * radius
    });
  }
  return pts;
}

// ----- Canvas 纹理生成 -----
function createGlowTexture(innerColor, outerColor, size) {
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const half = size / 2;
  const grad = ctx.createRadialGradient(half, half, 0, half, half, half);
  grad.addColorStop(0, innerColor);
  grad.addColorStop(0.15, innerColor);
  grad.addColorStop(1, outerColor);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}

function createNameTexture(name) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.shadowColor = 'rgba(201, 169, 110, 0.7)';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#f0e6d3';
  ctx.font = 'bold 32px "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(name, 128, 64);
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(240, 230, 211, 0.9)';
  ctx.fillText(name, 128, 64);
  return new THREE.CanvasTexture(canvas);
}

function createGoldenNameTexture(name) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.shadowColor = 'rgba(255, 200, 50, 1)';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#e0c78a';
  ctx.font = 'bold 36px "Noto Serif SC", "STSong", "SimSun", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(name, 128, 64);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff8ee';
  ctx.fillText(name, 128, 64);
  return new THREE.CanvasTexture(canvas);
}

// ----- 场景构建 -----
const sphereGroup = new THREE.Group();
scene.add(sphereGroup);

function createParticleSphere() {
  const count = CONFIG.particleCount;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const gold = new THREE.Color('#c9a96e');
  const jade = new THREE.Color('#5a9e8e');

  const pts = fibonacciSphere(count, CONFIG.sphereRadius);
  for (let i = 0; i < count; i++) {
    positions[i * 3] = pts[i].x;
    positions[i * 3 + 1] = pts[i].y;
    positions[i * 3 + 2] = pts[i].z;
    const mix = Math.random();
    const c = gold.clone().lerp(jade, mix);
    colors[i * 3] = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const dotTex = createGlowTexture('rgba(255,255,255,1)', 'rgba(255,255,255,0)', 64);
  const mat = new THREE.PointsMaterial({
    size: 0.09,
    map: dotTex,
    vertexColors: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: 0.85
  });

  const points = new THREE.Points(geo, mat);
  sphereGroup.add(points);
  return points;
}

function createWireframe() {
  const geo = new THREE.SphereGeometry(CONFIG.sphereRadius, 48, 24);
  const mat = new THREE.MeshBasicMaterial({
    color: 0x3a3528,
    wireframe: true,
    transparent: true,
    opacity: 0.1,
    depthWrite: true
  });
  const mesh = new THREE.Mesh(geo, mat);
  sphereGroup.add(mesh);
  return mesh;
}

function createRings() {
  const rings = [];
  const ringDefs = [
    { r: CONFIG.sphereRadius + 0.25, color: 0x998855, opacity: 0.2, rx: Math.PI / 2, rz: 0 },
    { r: CONFIG.sphereRadius + 0.45, color: 0x5a9e8e, opacity: 0.16, rx: Math.PI / 3, rz: Math.PI / 5 },
    { r: CONFIG.sphereRadius + 0.65, color: 0x887744, opacity: 0.12, rx: Math.PI / 4, rz: Math.PI / 3 }
  ];
  ringDefs.forEach(def => {
    const geo = new THREE.TorusGeometry(def.r, 0.012, 16, 160);
    const mat = new THREE.MeshBasicMaterial({
      color: def.color,
      transparent: true,
      opacity: def.opacity,
      depthWrite: false
    });
    const ring = new THREE.Mesh(geo, mat);
    ring.rotation.x = def.rx;
    ring.rotation.z = def.rz;
    sphereGroup.add(ring);
    rings.push(ring);
  });
  return rings;
}

function createAmbientParticles() {
  const count = CONFIG.ambientParticleCount;
  const positions = new Float32Array(count * 3);
  const spread = CONFIG.sphereRadius * 2.8;
  for (let i = 0; i < count; i++) {
    positions[i * 3] = (Math.random() - 0.5) * spread;
    positions[i * 3 + 1] = (Math.random() - 0.5) * spread;
    positions[i * 3 + 2] = (Math.random() - 0.5) * spread;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.025,
    color: 0x887744,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: 0.4
  });
  const pts = new THREE.Points(geo, mat);
  pts.userData.velocities = [];
  for (let i = 0; i < count; i++) {
    pts.userData.velocities.push({
      x: (Math.random() - 0.5) * 0.003,
      y: (Math.random() - 0.5) * 0.003,
      z: (Math.random() - 0.5) * 0.003
    });
  }
  scene.add(pts);
  return pts;
}

function createNameSprites() {
  clearNameSprites();
  if (names.length === 0) return;

  const pts = fibonacciSphere(names.length, CONFIG.sphereRadius + 0.5);
  const sharedMat = new THREE.SpriteMaterial({
    transparent: true,
    depthTest: true,
    depthWrite: false,
    opacity: 1
  });

  names.forEach((name, i) => {
    const tex = createNameTexture(name);
    const mat = sharedMat.clone();
    mat.map = tex;

    const sprite = new THREE.Sprite(mat);
    sprite.position.set(pts[i].x, pts[i].y, pts[i].z);
    sprite.scale.set(CONFIG.spriteScale * 2, CONFIG.spriteScale, 1);
    sprite.userData.basePosition = sprite.position.clone();
    sprite.userData.name = name;

    sphereGroup.add(sprite);
    nameSprites.push({ sprite, name });
  });
}

function clearNameSprites() {
  nameSprites.forEach(item => sphereGroup.remove(item.sprite));
  nameSprites = [];
  winnerSprite = null;
  winnerName = null;
}

const particleSphere = createParticleSphere();
const wireframe = createWireframe();
const rings = createRings();
const ambientParticles = createAmbientParticles();

// ----- 中奖庆祝粒子 -----
function spawnCelebration(worldPos) {
  const count = 180;
  const positions = new Float32Array(count * 3);
  const colorsArr = new Float32Array(count * 3);
  const velocities = [];

  const colorPalette = [
    new THREE.Color('#e0c78a'),
    new THREE.Color('#c9a96e'),
    new THREE.Color('#f0d898'),
    new THREE.Color('#ff6b6b'),
    new THREE.Color('#5a9e8e'),
    new THREE.Color('#ffffff')
  ];

  for (let i = 0; i < count; i++) {
    positions[i * 3] = worldPos.x;
    positions[i * 3 + 1] = worldPos.y;
    positions[i * 3 + 2] = worldPos.z;

    const dir = new THREE.Vector3(
      Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5
    ).normalize();
    const speed = 0.03 + Math.random() * 0.12;
    velocities.push(dir.multiplyScalar(speed));

    const col = colorPalette[Math.floor(Math.random() * colorPalette.length)];
    colorsArr[i * 3] = col.r;
    colorsArr[i * 3 + 1] = col.g;
    colorsArr[i * 3 + 2] = col.b;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colorsArr, 3));

  const mat = new THREE.PointsMaterial({
    size: 0.15,
    vertexColors: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
    opacity: 1
  });

  const points = new THREE.Points(geo, mat);
  scene.add(points);
  celebration = { points, velocities, life: 1 };
}

function updateCelebration() {
  if (!celebration) return;
  const posArr = celebration.points.geometry.attributes.position.array;
  for (let i = 0; i < celebration.velocities.length; i++) {
    posArr[i * 3] += celebration.velocities[i].x;
    posArr[i * 3 + 1] += celebration.velocities[i].y;
    posArr[i * 3 + 2] += celebration.velocities[i].z;
    celebration.velocities[i].y += 0.0004;
  }
  celebration.points.geometry.attributes.position.needsUpdate = true;
  celebration.life -= 0.006;
  celebration.points.material.opacity = Math.max(0, celebration.life);
  if (celebration.life <= 0) {
    scene.remove(celebration.points);
    celebration.points.geometry.dispose();
    celebration.points.material.dispose();
    celebration = null;
  }
}

function updateSpriteOpacity() {
  const cameraPos = camera.position;
  const worldPos = new THREE.Vector3();
  nameSprites.forEach(item => {
    if (winnerSprite && item.sprite === winnerSprite) return;
    item.sprite.getWorldPosition(worldPos);
    const normal = worldPos.clone().normalize();
    const toCamera = cameraPos.clone().sub(worldPos).normalize();
    const dot = normal.dot(toCamera);
    item.sprite.material.opacity = 0.1 + 0.9 * Math.max(0, dot);
  });
}

function updateAmbientParticles() {
  const posArr = ambientParticles.geometry.attributes.position.array;
  const vels = ambientParticles.userData.velocities;
  const spread = CONFIG.sphereRadius * 2.8;
  for (let i = 0; i < vels.length; i++) {
    posArr[i * 3] += vels[i].x;
    posArr[i * 3 + 1] += vels[i].y;
    posArr[i * 3 + 2] += vels[i].z;
    if (Math.abs(posArr[i * 3]) > spread / 2) vels[i].x *= -1;
    if (Math.abs(posArr[i * 3 + 1]) > spread / 2) vels[i].y *= -1;
    if (Math.abs(posArr[i * 3 + 2]) > spread / 2) vels[i].z *= -1;
  }
  ambientParticles.geometry.attributes.position.needsUpdate = true;
}

// ----- 抽奖逻辑 -----
function selectWinner() {
  if (names.length === 0) return;
  const idx = Math.floor(Math.random() * names.length);
  winnerName = names[idx];
  state = 'result';
  currentSpeed = 0;
  targetSpeed = 0;

  const winItem = nameSprites.find(item => item.name === winnerName);
  if (winItem) {
    winnerSprite = winItem.sprite;
    const goldenTex = createGoldenNameTexture(winnerName);
    winnerSprite.material.map = goldenTex;
    winnerSprite.material.opacity = 1;
    winnerSprite.material.needsUpdate = true;
    winnerSprite.scale.set(CONFIG.spriteScale * 3.2, CONFIG.spriteScale * 1.6, 1);

    const worldPos = new THREE.Vector3();
    winnerSprite.getWorldPosition(worldPos);
    spawnCelebration(worldPos);
  }

  winnerNameText.textContent = winnerName;
  winnerDisplay.classList.add('show');
  updateButtons();
}

function startLottery() {
  if (names.length === 0) {
    alert('请先输入抽奖名单！');
    return;
  }
  clearResult();
  state = 'spinning';
  targetSpeed = CONFIG.maxSpeed;
  updateButtons();
}

function stopLottery() {
  if (state !== 'spinning') return;
  state = 'decelerating';
  targetSpeed = 0;
  updateButtons();
}

function resetLottery() {
  clearResult();
  state = 'idle';
  currentSpeed = 0;
  targetSpeed = CONFIG.idleSpeed;
  updateButtons();
}

function clearResult() {
  if (winnerSprite && nameSprites.find(item => item.sprite === winnerSprite)) {
    const originalName = winnerSprite.userData.name;
    const tex = createNameTexture(originalName);
    winnerSprite.material.map = tex;
    winnerSprite.material.opacity = 1;
    winnerSprite.material.needsUpdate = true;
    winnerSprite.scale.set(CONFIG.spriteScale * 2, CONFIG.spriteScale, 1);
  }
  winnerSprite = null;
  winnerName = null;
  winnerDisplay.classList.remove('show');
  winnerNameText.textContent = '';

  if (celebration) {
    scene.remove(celebration.points);
    celebration.points.geometry.dispose();
    celebration.points.material.dispose();
    celebration = null;
  }
}

function updateButtons() {
  btnStart.disabled = (state === 'spinning' || state === 'decelerating');
  btnStop.disabled = (state !== 'spinning');
  btnApply.disabled = (state === 'spinning' || state === 'decelerating');
  nameInput.disabled = (state === 'spinning' || state === 'decelerating');
}

function parseNames(raw) {
  return raw
    .split(/[,，\s]+/)
    .map(s => s.trim())
    .filter(s => s.length > 0);
}

function applyNames() {
  if (state === 'spinning' || state === 'decelerating') return;
  const raw = nameInput.value;
  names = parseNames(raw);
  nameCount.textContent = `共 ${names.length} 人`;
  clearResult();
  createNameSprites();
  state = 'idle';
  currentSpeed = 0;
  targetSpeed = CONFIG.idleSpeed;
  updateButtons();
}

// ----- 鼠标交互 -----
let isDragging = false;
let prevMouse = { x: 0, y: 0 };
let cameraTheta = 0;
let cameraPhi = 0.15;

function updateCameraPosition() {
  const d = CONFIG.cameraDistance;
  camera.position.set(
    d * Math.sin(cameraTheta) * Math.cos(cameraPhi),
    d * Math.sin(cameraPhi),
    d * Math.cos(cameraTheta) * Math.cos(cameraPhi)
  );
  camera.lookAt(0, 0, 0);
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  isDragging = true;
  prevMouse.x = e.clientX;
  prevMouse.y = e.clientY;
  renderer.domElement.style.cursor = 'grabbing';
});

window.addEventListener('pointermove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  cameraTheta -= dx * 0.005;
  cameraPhi -= dy * 0.005;
  cameraPhi = Math.max(-1.2, Math.min(1.2, cameraPhi));
  updateCameraPosition();
  prevMouse.x = e.clientX;
  prevMouse.y = e.clientY;
});

window.addEventListener('pointerup', () => {
  isDragging = false;
  renderer.domElement.style.cursor = 'grab';
});
renderer.domElement.style.cursor = 'grab';

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  CONFIG.cameraDistance += e.deltaY * 0.01;
  CONFIG.cameraDistance = Math.max(8, Math.min(28, CONFIG.cameraDistance));
  updateCameraPosition();
}, { passive: false });

// ----- 键盘快捷键 -----
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') {
    e.preventDefault();
    if (state === 'spinning') stopLottery();
    else if (state === 'idle' || state === 'result') startLottery();
  } else if (e.code === 'KeyR') {
    resetLottery();
  }
});

// ----- 动画循环 -----
function animate() {
  requestAnimationFrame(animate);

  if (state === 'spinning') {
    currentSpeed += (targetSpeed - currentSpeed) * 0.04;
  } else if (state === 'decelerating') {
    currentSpeed *= CONFIG.decelFriction;
    if (currentSpeed < CONFIG.stopThreshold) {
      currentSpeed = 0;
      selectWinner();
    }
  } else if (state === 'idle') {
    currentSpeed += (targetSpeed - currentSpeed) * 0.02;
  }

  if (!isDragging || state === 'spinning' || state === 'decelerating') {
    sphereGroup.rotation.y += currentSpeed;
  }

  updateSpriteOpacity();
  updateCelebration();
  updateAmbientParticles();
  renderer.render(scene, camera);
}

// ----- 窗口大小调整 -----
window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// ----- 按钮事件 -----
btnStart.addEventListener('click', startLottery);
btnStop.addEventListener('click', stopLottery);
btnReset.addEventListener('click', resetLottery);
btnApply.addEventListener('click', applyNames);

// ----- 启动 -----
function init() {
  names = parseNames(nameInput.value);
  nameCount.textContent = `共 ${names.length} 人`;
  createNameSprites();
  updateButtons();
  updateCameraPosition();
  renderer.domElement.style.cursor = 'grab';
  animate();
}

init();
</script>
</body>
</html>
