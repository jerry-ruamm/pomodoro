<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>午饭救星</title>
<style>
:root {
  --bg: #faf7f2;
  --card: #ffffff;
  --text: #3d3929;
  --text-secondary: #8c8677;
  --accent: #e8833a;
  --accent-hover: #d4722b;
  --border: #e8e3d8;
  --shadow: 0 4px 24px rgba(61, 57, 41, 0.08);
  --radius: 16px;
  --radius-sm: 10px;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  padding: 20px 16px 40px;
}

.container {
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
}

/* 标题 */
.title {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--text);
  margin-top: 12px;
}

/* 结果卡片 */
.result-card {
  width: 100%;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 40px 24px;
  text-align: center;
  min-height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.result-text {
  font-size: 52px;
  font-weight: 800;
  color: var(--accent);
  text-shadow: 0 2px 12px rgba(232, 131, 58, 0.18);
  transition: transform 0.05s ease;
  word-break: keep-all;
}

.result-text.rolling {
  animation: jiggle 0.06s infinite;
}

@keyframes jiggle {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* 主按钮 */
.btn-main {
  font-size: 22px;
  font-weight: 700;
  padding: 16px 48px;
  border: none;
  border-radius: 50px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  letter-spacing: 2px;
  box-shadow: 0 6px 20px rgba(232, 131, 58, 0.30);
  transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.btn-main:hover {
  background: var(--accent-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(232, 131, 58, 0.35);
}

.btn-main:active {
  transform: scale(0.96);
  box-shadow: 0 4px 14px rgba(232, 131, 58, 0.25);
}

.btn-main:disabled {
  background: #ccc8bf;
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
}

/* 分隔 */
.divider {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--text-secondary);
  font-size: 14px;
  letter-spacing: 2px;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* 菜单列表 */
.menu-section {
  width: 100%;
}

.menu-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}

.menu-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 8px 14px;
  font-size: 15px;
  font-weight: 500;
  box-shadow: 0 1px 4px rgba(61, 57, 41, 0.04);
  transition: transform 0.1s;
}

.menu-item:hover {
  transform: scale(1.03);
}

.menu-item .del-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border: none;
  border-radius: 50%;
  background: #e8e3d8;
  color: #8c8677;
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
  flex-shrink: 0;
  transition: background 0.15s, color 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.menu-item .del-btn:hover {
  background: #e07060;
  color: #fff;
}

/* 添加区域 */
.add-row {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
}

.add-row input {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 50px;
  font-size: 15px;
  background: var(--card);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s;
}

.add-row input:focus {
  border-color: var(--accent);
}

.add-row input::placeholder {
  color: #b8b3a7;
}

.btn-add {
  padding: 12px 22px;
  border: none;
  border-radius: 50px;
  background: var(--text);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
}

.btn-add:hover {
  background: #555;
}

.btn-add:active {
  transform: scale(0.95);
}

/* 恢复默认 */
.btn-reset {
  width: 100%;
  padding: 12px;
  border: 1px dashed var(--border);
  border-radius: 50px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 14px;
  cursor: pointer;
  letter-spacing: 1px;
  transition: border-color 0.15s, color 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.btn-reset:hover {
  border-color: #e07060;
  color: #d06050;
}

/* 空状态 */
.empty-hint {
  text-align: center;
  color: var(--text-secondary);
  font-size: 15px;
  padding: 20px 0;
}

/* 响应式 */
@media (max-width: 400px) {
  .result-text {
    font-size: 40px;
  }

  .btn-main {
    font-size: 19px;
    padding: 14px 38px;
  }

  .title {
    font-size: 24px;
  }
}

@media (min-width: 768px) {
  .container {
    padding-top: 20px;
  }
}
</style>
</head>
<body>
<div class="container">
  <h1 class="title">🥢 午饭救星</h1>

  <div class="result-card">
    <div class="result-text" id="result">今天吃啥？</div>
  </div>

  <button class="btn-main" id="btnRoll" onclick="roll()">今天吃啥</button>

  <div class="divider">我的菜单</div>

  <div class="menu-section">
    <div class="menu-grid" id="menuGrid"></div>
    <div class="empty-hint" id="emptyHint" style="display:none">暂无选项，请添加一些美食 🍜</div>

    <div class="add-row">
      <input id="inputAdd" type="text" placeholder="输入新选项，如：重庆小面" maxlength="30" onkeydown="if(event.key==='Enter')addItem()">
      <button class="btn-add" onclick="addItem()">添加</button>
    </div>

    <button class="btn-reset" onclick="resetDefault()">恢复默认菜单</button>
  </div>
</div>

<script>
const STORAGE_KEY = "lunchMenu";
const DEFAULTS = [
  "黄焖鸡", "麻辣烫", "兰州拉面", "沙县小吃", "盖浇饭",
  "螺蛳粉", "汉堡", "自选快餐", "饺子", "凉皮+肉夹馍"
];

let menu = [];
let isRolling = false;

// --- localStorage ---
function loadMenu() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length > 0) {
        menu = parsed;
        return;
      }
    }
  } catch (_) { /* ignore corrupt data */ }
  menu = [...DEFAULTS];
}

function saveMenu() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(menu));
}

// --- 渲染 ---
function renderMenu() {
  const grid = document.getElementById("menuGrid");
  const emptyHint = document.getElementById("emptyHint");
  const btnRoll = document.getElementById("btnRoll");

  grid.innerHTML = "";
  if (menu.length === 0) {
    emptyHint.style.display = "block";
    btnRoll.disabled = true;
  } else {
    emptyHint.style.display = "none";
    btnRoll.disabled = false;
  }

  menu.forEach(function(item, idx) {
    var tag = document.createElement("span");
    tag.className = "menu-item";
    tag.innerHTML =
      '<span>' + escapeHTML(item) + '</span>' +
      '<button class="del-btn" aria-label="删除">&times;</button>';
    tag.querySelector(".del-btn").onclick = function(e) {
      e.stopPropagation();
      removeItem(idx);
    };
    grid.appendChild(tag);
  });
}

function escapeHTML(str) {
  var div = document.createElement("div");
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

// --- 操作 ---
function addItem() {
  var input = document.getElementById("inputAdd");
  var val = input.value.trim();
  if (!val) return;
  menu.push(val);
  saveMenu();
  renderMenu();
  input.value = "";
  input.focus();
}

function removeItem(idx) {
  menu.splice(idx, 1);
  saveMenu();
  renderMenu();
  // 如果结果文本正是被删除的那项，清空
  var resultEl = document.getElementById("result");
  if (!menu.includes(resultEl.textContent) && resultEl.textContent !== "今天吃啥？") {
    resultEl.textContent = "今天吃啥？";
  }
}

function resetDefault() {
  if (!confirm("确定要用默认列表覆盖当前菜单吗？")) return;
  menu = [...DEFAULTS];
  saveMenu();
  renderMenu();
  document.getElementById("result").textContent = "今天吃啥？";
}

// --- 随机滚动 ---
function roll() {
  if (isRolling) return;
  if (menu.length === 0) {
    alert("菜单为空，请先添加一些美食吧！");
    return;
  }

  isRolling = true;
  var btn = document.getElementById("btnRoll");
  var resultEl = document.getElementById("result");
  btn.disabled = true;

  var ticks = 0;
  var maxTicks = 14 + Math.floor(Math.random() * 6); // 14~19 次变化
  var interval = 80;

  // 预选最终结果
  var finalIdx = Math.floor(Math.random() * menu.length);

  var timer = setInterval(function() {
    // 随机显示一个选项
    var randomIdx = Math.floor(Math.random() * menu.length);
    resultEl.textContent = menu[randomIdx];
    resultEl.classList.add("rolling");
    ticks++;

    if (ticks >= maxTicks) {
      clearInterval(timer);
      resultEl.classList.remove("rolling");
      resultEl.textContent = menu[finalIdx];
      isRolling = false;
      btn.disabled = false;
    }
  }, interval);

  // 首次点击立即显示一次变化
  resultEl.textContent = menu[Math.floor(Math.random() * menu.length)];
}

// --- 初始化 ---
loadMenu();
renderMenu();
</script>
</body>
</html>
